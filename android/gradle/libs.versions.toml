# Version catalog for the OneSignal Capacitor Android plugin.
#
# The Kotlin Gradle Plugin and Android Gradle Plugin are intentionally NOT
# listed here. The plugin inherits both from the host Capacitor app's root
# buildscript so the same artifact works on Capacitor 7 (Kotlin 1.9.x /
# AGP 8.2.x) and Capacitor 8 (Kotlin 2.1.x / AGP 8.7+).
#
# compileSdk / minSdk / targetSdk / appcompat / junit defaults follow
# Capacitor 7's required floors. Host apps can override any of them by
# setting rootProject.ext.<key>Version (see android/build.gradle.kts).

[versions]
androidxAppCompat = "1.7.0"
androidxEspresso = "3.6.1"
androidxTestJunit = "1.2.1"
compileSdk = "35"
junit = "4.13.2"
minSdk = "23"
onesignal = "5.9.1"
targetSdk = "35"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppCompat" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxEspresso" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
junit = { module = "junit:junit", version.ref = "junit" }
onesignal = { module = "com.onesignal:OneSignal", version.ref = "onesignal" }
