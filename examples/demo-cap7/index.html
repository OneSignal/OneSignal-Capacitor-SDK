<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>OneSignal Capacitor 7 Demo</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      body {
        margin: 0;
        padding: 24px 20px env(safe-area-inset-bottom) 20px;
        padding-top: calc(env(safe-area-inset-top) + 24px);
      }
      h1 {
        font-size: 22px;
        margin: 0 0 4px;
      }
      p.subtitle {
        margin: 0 0 24px;
        opacity: 0.7;
        font-size: 14px;
      }
      button {
        display: block;
        width: 100%;
        padding: 14px 16px;
        margin: 0 0 12px;
        font-size: 16px;
        border-radius: 10px;
        border: 1px solid #888;
        background: #007aff;
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
      }
      pre#log {
        margin-top: 24px;
        padding: 12px;
        background: rgba(127, 127, 127, 0.15);
        border-radius: 8px;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 280px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h1>OneSignal Capacitor 7 Demo</h1>
    <p class="subtitle">Hello-world for verifying the OneSignal plugin on Capacitor 7.</p>
    <button id="init">1. Initialize OneSignal</button>
    <button id="requestPermission">2. Request Notification Permission</button>
    <button id="testNotification">3. Show OneSignal ID (send a test push to it)</button>
    <pre id="log"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
